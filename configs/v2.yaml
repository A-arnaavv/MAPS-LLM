experiment:
  status: exploratory_v2
  tasks: 500
  seeds: 20
  seed_offset: 50000
  users: 5
  models: 4
objectives:
  - normalized_cost
  - normalized_latency
  - quality_loss
  - sla_risk
  - outcome_unfairness
controls:
  - strongest
  - cheapest
  - sla_greedy
  - weighted_sum
  - contextual_ucb
  - nsga2_control
research_rule: "v2 uses fresh seeds; do not call exploratory results a final test"
